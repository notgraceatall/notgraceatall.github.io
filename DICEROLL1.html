<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="mystyle.css">
    <title>DICE</title>
</head>
<body>

<h1>ROLL DICE</h1>

DICE ROLL FOR D4: <input type="text" id="dice1" value="1">
<button type="button" onclick="rollDiceD4()">
    <img src="https://th.bing.com/th/id/OIP.WCEOd-2DHpLnKvBV9YHy8wHaHM?w=201&h=195&c=7&r=0&o=7&pid=1.7&rm=3"
        alt="Dice Image" style="width: 50px; height: 50px;">
</button>

<br>

DICE ROLL FOR D6: <input type="text" id="dice2" value="1">
<button type="button" onclick="rollDiceD6()">
    <img src="https://th.bing.com/th/id/OIP.6gEHp37BrIblxaXCa_QHeAHaHa?w=197&h=197&c=7&r=0&o=7&pid=1.7&rm=3"
        alt="Dice Image" style="width: 50px; height: 50px;">
</button>

<br>

DICE ROLL FOR D8: <input type="text" id="dice3" value="1">
<button onclick="rollDiceD8()">
    <img src="https://cdn11.bigcommerce.com/s-70184/images/stencil/2560w/products/536/7427/d8-dice-white__61297.1652305868.jpg?c=2"
        alt="Dice Image" style="width: 50px; height: 50px;">
</button>

<br>

DICE ROLL FOR D10: <input type="text" id="dice4" value="1">
<button onclick="rollDiceD10()">
    <img src="https://static.wikitide.net/dicewiki/thumb/2/23/D10_Chessex_1-10.png/300px-D10_Chessex_1-10.png"
        alt="Dice Image" style="width: 50px; height: 50px;">
</button>

<script>
function rollDiceD4()
{
    var dice1 = Math.floor((Math.random() * 4)+1);
    document.getElementById("dice1").value = dice1;
}

</script>

<script>
function rollDiceD6()
{
    var dice1 = Math.floor((Math.random() * 6)+1);
    document.getElementById("dice2").value = dice1;
}

</script>

<script>
function rollDiceD8()
{
    var dice1 = Math.floor((Math.random() * 8)+1);
    document.getElementById("dice3").value = dice1;
}

</script>

<script>
function rollDiceD10()
{
    var dice1 = Math.floor((Math.random() * 10)+1);
    document.getElementById("dice4").value = dice1;
}

</script>
</body>
</html>
